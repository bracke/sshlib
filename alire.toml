name = "ssh_lib"
description = "Pure Ada 2022 SSH client API foundation"
version = "1.0.0"
licenses = "MIT"

authors = ["Bent Bracke"]
maintainers = ["Bent Bracke <bent@bracke.dk>"]
maintainers-logins = ["bracke"]
website = "https://github.com/bracke/sshlib"
long-description = "Pass 508 adds explicit credential storage helpers through WriteCredentialStore, ReadCredentialStore, and DeleteCredentialStore, using bounded .git/credentials records and preserving unrelated entries."
tags = ["ssh", "network", "transport"]
project-files = ["SSH_Lib.gpr"]

[[depends-on]]
gnat_native = "=15.2.1"

[[depends-on]]
zlib = "*"

[[depends-on]]
hostkit = "*"

[[pins]]
hostkit = { path = "../hostkit" }
zlib = { path='../zlib' }

[[depends-on]]
cryptolib = "*"

[[pins]]
cryptolib = { path='../cryptolib' }

[build-profiles]
"*" = "development"
