name = "ssh_lib_version_integration"
description = "Version/shape integration tests for ssh_lib"
version = "0.1.0-dev"
licenses = "MIT"

authors = ["Bent Bracke"]
maintainers = ["Bent Bracke <bent@bracke.dk>"]
maintainers-logins = ["bracke"]
website = "https://github.com/bracke/sshlib"
tags = ["ssh", "tests"]

project-files = ["version_integration.gpr"]

executables = ["version_ssh_shape", "test_version_fixture", "test_version_adapter_consumption"]

[[depends-on]]
gnat_native = "=15.2.1"

# White-box suite: it withs ../ssh_lib_internal.gpr, which recompiles the library
# sources directly, so this root must NOT depend on ssh_lib (that would put the same
# sources in two projects). It declares the library's own dependencies instead.
[[depends-on]]
aunit = "^26.0.0"

[[depends-on]]
cryptolib = "*"

[[depends-on]]
zlib = "*"

[[depends-on]]
hostkit = "*"

[[pins]]
cryptolib = { path = "../../../cryptolib" }
zlib = { path = "../../../zlib" }
hostkit = { path = "../../../hostkit" }

[build-profiles]
"*" = "development"
